<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IWT - Emulation</title>
	<link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="sidebar">
        <div class="sidebar-header">Consoles</div>
        <div class="game-list" id="sidebarList">
            </div>
    </div>

    <div class="main-view">
        <div class="grid-container" id="gridContainer">
            </div>
		<div class="version-watermark">IWT May Update 3.2</div>
    </div>

    <script>
const gameData = {
            'index': { 
                title: 'Back to Home', 
                url: 'index.html',
				banner: 'banners/placeholderbanner.jpg'
            },
            'nesroot': { 
                title: "NES", 
                url: 'nes/',
				banner: 'banners/nes.png'
            },
			// Placeholder for the category system. It wont be added until May Update 4
			// Game Boy and Game Boy Advance games will be merged into the same category.
            'gbroot': { 
                title: "Game Boy", 
                url: 'placeholder.html',
				banner: 'banners/placeholderbanner.jpg'
            },
            'snesroot': { 
                title: "SNES", 
                url: 'snes/',
				banner: 'banners/snes.png'
            },
            'n64': { 
                title: "N64 WASM", 
                url: 'n64/dist/index.html',
                banner: 'banners/n64.png'
            },
			// move to gbroot
			'tetris': {
				title: "Tetris (Game Boy)",
				url: 'gb/tetris.html',
				banner: 'banners/tetris.png'
			},
			'sonic1': {
				title: "Sonic the Hedgehog 1",
				url: 'genesis/sonic1.html',
				banner: 'banners/sonic1.png'
			},
			// move to gbroot
            'wario4': { 
                title: "Wario Land 4", 
                url: 'gba/warioland4.html',
                banner: 'banners/warioland4.png'
            },
        };
        const gridContainer = document.getElementById('gridContainer');
        const sidebarList = document.getElementById('sidebarList');

        Object.keys(gameData).forEach(key => {
            const game = gameData[key];
            const card = document.createElement('div');
            card.className = 'game-card';
            card.onclick = () => window.location.href = game.url;
			card.innerHTML = `
                <img src="${game.banner || 'banners/placeholderbanner.png'}" alt="${game.title}">
                <div class="card-info">${game.title}</div>
            `;
            gridContainer.appendChild(card);
            const sidebarItem = document.createElement('div');
            sidebarItem.className = 'sidebar-item';
            sidebarItem.innerText = game.title;
            sidebarItem.onclick = () => window.location.href = game.url;
            sidebarList.appendChild(sidebarItem);
        });	
    </script>
</body>
</html>
