<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IWT - Emulation</title>
	<script>
        (function() {
            const savedTheme = localStorage.getItem("selected-theme") || "asahina";
            document.documentElement.setAttribute("data-theme", savedTheme);
        })();
    </script>
	<link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="sidebar">
        <div class="sidebar-header">Consoles</div>
        <div class="game-list" id="sidebarList">
            </div>
    </div>

    <div class="main-view">
        <div class="grid-container" id="gridContainer">
            </div>
		<div class="version-watermark">IWT May Update 5</div>
    </div>

    <script>
const gameData = {
            'index': { 
                title: 'Back to Home', 
                url: 'index.html',
				banner: 'banners/placeholderbanner.jpg'
            },
            'nesroot': { 
                title: "NES", 
                url: 'nes/',
				banner: 'banners/nes.png'
            },
            'snesroot': { 
                title: "SNES", 
                url: 'snes/',
				banner: 'banners/snes.png'
            },
            'gbroot': { 
                title: "Game Boy", 
                url: 'gb/',
				banner: 'banners/gba.png'
            },
//            'n64root': { 
//                title: "N64", 
//                url: 'placeholder.html',
//                banner: 'banners/n64.png'
//            },
            'dsroot': { 
                title: "DS", 
                url: 'ds/',
				banner: 'banners/ds.png'
            },
            'genesisroot': { 
                title: "Genesis", 
                url: 'genesis/',
				banner: 'banners/genesis.png'
            },
        };
        const gridContainer = document.getElementById('gridContainer');
        const sidebarList = document.getElementById('sidebarList');

        Object.keys(gameData).forEach(key => {
            const game = gameData[key];
            const card = document.createElement('div');
            card.className = 'game-card';
            card.onclick = () => window.location.href = game.url;
			card.innerHTML = `
                <img src="${game.banner || 'banners/placeholderbanner.png'}" alt="${game.title}">
                <div class="card-info">${game.title}</div>
            `;
            gridContainer.appendChild(card);
            const sidebarItem = document.createElement('div');
            sidebarItem.className = 'sidebar-item';
            sidebarItem.innerText = game.title;
            sidebarItem.onclick = () => window.location.href = game.url;
            sidebarList.appendChild(sidebarItem);
        });	
    </script>
<script src="theme.js"></script> <!-- TODO: Add these to every other page -->
</body>
</html>
