<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SEKAI ORGANISATION - APPLICATION PORTAL</title>
    <style>
        :root {
            --bg-red-intensity: 0;
            --ambient-bg: rgb(var(--bg-red-intensity), 0, 0);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--ambient-bg);
            color: #ffffff;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            padding: 20px;
            transition: background-color 1.5s ease-in-out;
        }

        /* Ambient CRT scanline overlay */
        body::before {
            content: " ";
            display: block;
            position: fixed;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.3) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.04), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.04));
            z-index: 999;
            background-size: 100% 4px, 6px 100%;
            pointer-events: none;
        }

        .terminal {
            width: 100%;
            max-width: 600px;
            border: 1px solid #ffffff;
            background-color: #000000;
            padding: 40px;
            box-shadow: 0 0 25px rgba(255, 255, 255, 0.05);
            position: relative;
        }

        .header {
            border-bottom: 1px dashed #ffffff;
            padding-bottom: 15px;
            margin-bottom: 30px;
            font-size: 0.85rem;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .step-indicator {
            float: right;
        }

        .question-container {
            min-height: 150px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .question-text {
            font-size: 1.1rem;
            margin-bottom: 25px;
            line-height: 1.5;
            transition: text-shadow 0.3s ease;
        }

        /* Glitch text effect for late questions */
        .glitch-text {
            text-shadow: 2px 0 #ff0000, -2px 0 #0000ff;
        }

        .input-wrapper {
            position: relative;
        }

        input[type="text"] {
            width: 100%;
            background: transparent;
            border: none;
            border-bottom: 1px solid #ffffff;
            color: #ffffff;
            font-family: inherit;
            font-size: 1.1rem;
            padding: 5px 0;
            outline: none;
        }

        .footer-telemetry {
            margin-top: 30px;
            border-top: 1px dashed #ffffff;
            padding-top: 15px;
            font-size: 0.75rem;
            letter-spacing: 1px;
            display: flex;
            justify-content: space-between;
            color: #888888;
        }

        .nav-zone {
            margin-top: 25px;
            display: flex;
            justify-content: flex-end;
        }

        button {
            background-color: #ffffff;
            color: #000000;
            border: 1px solid #ffffff;
            padding: 8px 24px;
            font-family: inherit;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.2s ease;
        }

        button:hover {
            background-color: #000000;
            color: #ffffff;
        }

        /* Ultimate Flash Overlay */
        .scare-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: #ff0000;
            color: #ffffff;
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 10000;
            font-family: 'Courier New', Courier, monospace;
            font-size: 3.5rem;
            font-weight: 900;
            letter-spacing: -1px;
            animation: jitter 0.1s infinite;
        }

        @keyframes jitter {
            0% { transform: translate(0, 0) scale(1); }
            20% { transform: translate(-4px, 3px) scale(1.02); }
            40% { transform: translate(3px, -2px) scale(0.98); }
            60% { transform: translate(-2px, -3px) scale(1.01); }
            80% { transform: translate(4px, 2px) scale(0.99); }
            100% { transform: translate(0, 0) scale(1); }
        }
    </style>
</head>
<body>

    <div class="terminal">
        <div class="header">
            <span class="step-indicator">SYS_REF: <span id="current-step">1</span>/8</span>
            SEKAI ORG // APPL_FORM_72
        </div>

        <div class="question-container">
            <p class="question-text" id="question-label">Initializing system variables...</p>
            <div class="input-wrapper">
                <input type="text" id="user-input" autocomplete="off" autofocus>
            </div>
        </div>

        <div class="footer-telemetry">
            <span id="tel-left">BIOMETRIC MONITOR: STANDBY</span>
            <span id="tel-right">THREAT LEVEL: 0%</span>
        </div>

        <div class="nav-zone">
            <button id="action-btn" onclick="processNext()">Next</button>
        </div>
    </div>

    <!-- Red Jump scare Screen -->
    <div id="scare" class="scare-overlay">NO PLEASE DONT</div>

    <script>
        const questions = [
            "Input your 12-digit Employee Clearance Index. (If you are accessing this portal from an unmapped sector, type 'EXTERNAL_00').",
            "Are you aware of the anomalies occurring outside the direct boundary of your vision?",
            "Our telemetry suggests NATALIE is the only one beginning to remember the previous iterations. How much has she told you about what happened to Isabelle?",
            "If your primary directive failed right now, who would inherit your operational burden?",
            "A baseline temporal scan indicates your heart rate spiked at the mention of 'Core_TRZP'. Quantify your current level of cognitive dissonance from 1 to 10.",
            "Do you consent to physical extraction if environmental conditions degrade past 40%?",
            "Subject 'ISABELLE' is designated as highly classified property of SEKAI. State your operational justification for attempting to breach her containment chamber.",
            "The document requires a final physical signature. Do you understand what happens once you submit?"
        ];

        // Telemetry text sequences corresponding to each question step
        const telemetryLeft = [
            "BIOMETRIC MONITOR: CONNECTING...",
            "BIOMETRIC MONITOR: PUPIL DILATION DETECTED",
            "BIOMETRIC MONITOR: SIGNAL INTERFERENCE // CORRUPTION",
            "BIOMETRIC MONITOR: ELEVATED CEREBRAL ACTIVITY",
            "BIOMETRIC MONITOR: HEART RATE SPIKE",
            "BIOMETRIC MONITOR: PERSPIRES INDUCTION",
            "BIOMETRIC MONITOR: SEVERE ANXIETY TRACE",
            "BIOMETRIC MONITOR: UNSTABLE"
        ];

        const telemetryRight = [
            "THREAT LEVEL: 4%",
            "THREAT LEVEL: 12%",
            "THREAT LEVEL: UNKNOWN",
            "THREAT LEVEL: 38%",
            "THREAT LEVEL: 61%",
            "THREAT LEVEL: 74%",
            "THREAT LEVEL: 90%",
            "THREAT LEVEL: CRITICAL"
        ];

        let currentQuestionIdx = 0;
        
        // Web Audio Synthesizer variables
        let audioCtx = null;
        let ambientOsc = null;
        let ambientGain = null;

        function initAudio() {
            if (audioCtx) return; // Prevent duplicating instances
            
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            ambientOsc = audioCtx.createOscillator();
            ambientGain = audioCtx.createGain();
            
            ambientOsc.type = 'sine';
            // Start with a deep, low 45Hz drone
            ambientOsc.frequency.setValueAtTime(45, audioCtx.currentTime);
            ambientGain.gain.setValueAtTime(0.06, audioCtx.currentTime);
            
            ambientOsc.connect(ambientGain);
            ambientGain.connect(audioCtx.destination);
            ambientOsc.start();
        }

        function updateAtmosphere() {
            // 1. Creeping background red value
            const targetRed = currentQuestionIdx * 8; 
            document.documentElement.style.setProperty('--bg-red-intensity', targetRed);

            // 2. Telemetry Updates
            document.getElementById('tel-left').innerText = telemetryLeft[currentQuestionIdx];
            document.getElementById('tel-right').innerText = telemetryRight[currentQuestionIdx];

            // 3. Late-stage text jitter/glitch
            const textElement = document.getElementById('question-label');
            if (currentQuestionIdx >= 5) {
                textElement.classList.add('glitch-text');
            } else {
                textElement.classList.remove('glitch-text');
            }

            // 4. Audio scaling tension (Frequency increases, gain grows slightly)
            if (audioCtx && ambientOsc) {
                const newFreq = 45 + (currentQuestionIdx * 12); // Scales up towards ~130Hz
                const newGain = 0.06 + (currentQuestionIdx * 0.015);
                ambientOsc.frequency.exponentialRampToValueAtTime(newFreq, audioCtx.currentTime + 1.0);
                ambientGain.gain.linearRampToValueAtTime(newGain, audioCtx.currentTime + 1.0);
            }
        }

        function loadQuestion() {
            document.getElementById('current-step').innerText = currentQuestionIdx + 1;
            document.getElementById('question-label').innerText = questions[currentQuestionIdx];
            
            updateAtmosphere();

            const inputField = document.getElementById('user-input');
            inputField.value = "";
            inputField.focus();

            if (currentQuestionIdx === questions.length - 1) {
                document.getElementById('action-btn').innerText = "Submit";
            }
        }

        function processNext() {
            const userInput = document.getElementById('user-input').value.trim();
            
            if (userInput === "") {
                alert("Field cannot remain empty. SEKAI demands variable collection.");
                return;
            }

            if (currentQuestionIdx < questions.length - 1) {
                currentQuestionIdx++;
                loadQuestion();
            } else {
                executeSystemInterdiction();
            }
        }

function executeSystemInterdiction() {
    // ---- NEW COOKIE LOGIC ----
    // Set cookie to '1' (completed). 
    // max-age=31536000 makes it persist for 1 full year so they can't easily undo it.
    // path=/ ensures it can be read across your entire github.io repository structure.
    document.cookie = "sekai_complete=1; max-age=31536000; path=/; SameSite=Strict";
    // --------------------------

    // Kill base ambient hum instantly
    if (ambientOsc) { try { ambientOsc.stop(); } catch(e){} }

    // Synthesize short high-frequency white/static noise blast
    if (audioCtx) {
        try {
            let bufferSize = audioCtx.sampleRate * 1.2;
            let buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
            let data = buffer.getChannelData(0);
            for (let i = 0; i < bufferSize; i++) {
                data[i] = Math.random() * 2 - 1;
            }
            let noiseNode = audioCtx.createBufferSource();
            noiseNode.buffer = buffer;
            let noiseGain = audioCtx.createGain();
            noiseGain.gain.setValueAtTime(0.3, audioCtx.currentTime);
            noiseGain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 1.2);
            noiseNode.connect(noiseGain);
            noiseGain.connect(audioCtx.destination);
            noiseNode.start();
        } catch(audioErr) {}
    }

    // Display screaming scare screen
    const scareScreen = document.getElementById('scare');
    scareScreen.style.display = 'flex';
    
    setTimeout(() => {
        window.location.href = "index.html";
    }, 1200);
}

        // Keyboard Manager: Handles core inputs and Natalie input interception
        document.getElementById('user-input').addEventListener('keydown', function(e) {
            // Initialize audio on very first user interaction to bypass browser policies safely
            if (!audioCtx) {
                initAudio();
            }

            // Natalie Override Phase (Question Index 2 = Step 3)
            if (currentQuestionIdx === 2) {
                if (e.key === 'Enter' || e.key === 'Tab') {
                    return; // Retain passing capability via standard submissions paths
                }

                e.preventDefault(); // Mute their real typing characters

                const targetText = "DONT ANSWER THEM";
                const currentLen = this.value.length;
                
                if (currentLen < targetText.length) {
                    this.value += targetText[currentLen];
                }
            } else {
                // Regular submission handler mapping
                if (e.key === 'Enter') {
                    processNext();
                }
            }
        });

        window.onload = loadQuestion;
    </script>
</body>
</html>
