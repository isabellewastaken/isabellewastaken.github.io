<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TRZP - Home</title>
	<script>
        (function() {
            const savedTheme = localStorage.getItem("selected-theme") || "asahina";
            document.documentElement.setAttribute("data-theme", savedTheme);
        })();
    </script>
    <link rel="stylesheet" href="style.css">
    <style>
        .theme-switcher-container {
            margin-top: auto;
            padding: 15px 20px 20px 20px;
            border-top: 1px solid rgba(255, 255, 255, 0.03);
        }

        .theme-switcher-label {
            font-size: 0.75em;
            font-weight: bold;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 8px;
        }

        .theme-select {
            width: 100%;
            padding: 8px;
            background-color: var(--steam-card-bg);
            color: var(--text-light);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 4px;
            font-family: inherit;
            font-size: 0.85em;
            cursor: pointer;
            outline: none;
            transition: border-color 0.15s;
        }

        .theme-select:focus, .theme-select:hover {
            border-color: var(--steam-blue);
        }
    </style>
</head>
<body>
    <div class="sidebar">
        <div class="sidebar-header">TRZP Game Portal</div>
        
	<div class="theme-switcher-container">
		<div class="theme-switcher-label">Theme</div>
		<select id="themeSelect" class="theme-select">
				<option value="asahina">TRZP Asahina</option>
				<option value="akiyama">TRZP Akiyama</option>
				<option value="shinonome">TRZP Shinonome</option>
				<option value="yoisaki">TRZP Yoisaki</option>
				<option value="legacy">TRZP Steam</option>
				<option value="x10-white">x10 Theme</option>
		</select>
		</div>
    </div>
    
    <div class="main-view">
        <div class="grid-container" id="gridContainer"></div>
    </div>

<script>
    const gameData = {
        'emuroot': { 
            title: "", 
            url: 'emulation.html',
            banner: 'banners/emulation.png'
        },
        'webroot': { 
            title: "Web Games", 
            url: "web/",
            banner: 'banners/placeholderbanner.jpg'
        },
        'eaglerroot': { 
            title: '', 
            url: 'eaglercraftroot.html',
            banner: 'banners/eagler.jpg'
        },
        'fnafroot': { 
            title: "", 
            url: 'fnaf/',
            banner: 'banners/fnaf1.png'
        },
        'chess': { 
            title: "", 
            url: "https://pleasedontblockchess.com",
            banner: 'banners/chess.png'
        },
    };

    const gridContainer = document.getElementById('gridContainer');
    const sidebarList = document.getElementById('sidebarList');

    Object.keys(gameData).forEach(key => {
        const game = gameData[key];
        const card = document.createElement('div');
        card.className = 'game-card';
        card.onclick = () => window.location.href = game.url;
        card.innerHTML = `
            <img src="${game.banner || 'banners/placeholderbanner.png'}" alt="${game.title}">
            <div class="card-info">${game.title}</div>
        `;
        gridContainer.appendChild(card);
    });
</script>

<script src="theme.js"></script>
</body>
</html>
