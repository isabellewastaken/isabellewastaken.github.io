<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TRZP Games</title>
	<script>
        (function() {
            const savedTheme = localStorage.getItem("selected-theme") || "purple";
            document.documentElement.setAttribute("data-theme", savedTheme);
        })();
    </script>
    <link rel="stylesheet" href="style.css">
    <style>
        .theme-switcher-container {
            margin-top: auto;
            padding: 15px 20px 20px 20px;
            border-top: 1px solid rgba(255, 255, 255, 0.03);
        }

        .theme-switcher-label {
            font-size: 0.75em;
            font-weight: bold;
            color: var(--text-muted);
            letter-spacing: 1px;
            margin-bottom: 8px;
        }

        .theme-select {
            width: 100%;
            padding: 8px;
            background-color: var(--steam-card-bg);
            color: var(--text-light);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 4px;
            font-family: inherit;
            font-size: 0.85em;
            cursor: pointer;
            outline: none;
            transition: border-color 0.15s;
        }

        .theme-select:focus, .theme-select:hover {
            border-color: var(--steam-blue);
        }
    </style>
</head>
<body>
	<div class="sidebar">
        <div class="sidebar-header">TRZP Games</div>
      
	<div class="theme-switcher-container">
		<div class="theme-switcher-label">Theme</div>
		<select id="themeSelect" class="theme-select">
				<option value="purple">Purple</option>
				<option value="bpink">Bright Pink</option>
				<option value="steam">Legacy</option>
		</select>
		</div>
    </div>
    
    <div class="main-view">
        <div class="grid-container" id="gridContainer"></div>
    </div>

	const userAgent = navigator.userAgent;

	if (userAgent.includes("Windows NT 6.4") && userAgent.includes("Firefox/420")) {
		for (const gameId in gameData) {
			const url = gameData[gameId].url;
    
    	// Hides any link starting with http/https unless it belongs to your GitHub domain
    	if (url.startsWith("http") && !url.includes("isabellewastaken.github.io")) {
			delete gameData[gameId];
    	}
  		}
	}

	
    const gridContainer = document.getElementById('gridContainer');
    const sidebarList = document.getElementById('sidebarList');

    Object.keys(gameData).forEach(key => {
        const game = gameData[key];
        const card = document.createElement('div');
        card.className = 'game-card';
        card.onclick = () => window.location.href = game.url;
        card.innerHTML = `
            <img src="${game.banner || 'banners/placeholderbanner.jpg'}">
        `;
        gridContainer.appendChild(card);
    });

<script src="theme.js"></script>
