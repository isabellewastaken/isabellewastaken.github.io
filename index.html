<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IWT - Main Page</title>
	<script>
        (function() {
            const savedTheme = localStorage.getItem("selected-theme") || "asahina";
            document.documentElement.setAttribute("data-theme", savedTheme);
        })();
    </script>
    <link rel="stylesheet" href="style.css">
    <style>
        .theme-switcher-container {
            margin-top: auto;
            padding: 15px 20px 20px 20px;
            border-top: 1px solid rgba(255, 255, 255, 0.03);
        }

        .theme-switcher-label {
            font-size: 0.75em;
            font-weight: bold;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 8px;
        }

        .theme-select {
            width: 100%;
            padding: 8px;
            background-color: var(--steam-card-bg);
            color: var(--text-light);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 4px;
            font-family: inherit;
            font-size: 0.85em;
            cursor: pointer;
            outline: none;
            transition: border-color 0.15s;
        }

        .theme-select:focus, .theme-select:hover {
            border-color: var(--steam-blue);
        }
    </style>
	<script>
    (function() {
        // Function to look up a cookie by its name
        function getCookie(name) {
            let match = document.cookie.match(new RegExp('(^| )' + name + '=([^;]+)'));
            return match ? match[2] : null;
        }

        // Check our custom SEKAI portal tracking variable
        let applicationState = getCookie("sekai_complete");

        // IF the cookie is explicitly "0", or it doesn't exist at all (first-time visitor):
        if (applicationState === "0" || applicationState === null) {
            // Forcefully route them to your questionnaire page
            // (Adjust "application_form.html" to whatever your form filename is)
            window.location.href = "firstrun.html"; 
        }
        // If it is "1", the script naturally stops executing and does absolutely nothing.
    })();
</script>
</head>
<body>
    <div class="sidebar">
        <div class="sidebar-header">Categories</div>
        <div class="game-list" id="sidebarList"></div>
        
	<div class="theme-switcher-container">
		<div class="theme-switcher-label">Theme</div>
		<select id="themeSelect" class="theme-select">
        
			<optgroup label="Niigo Theme Pack">
				<option value="asahina">IWT Asahina</option>
				<option value="akiyama">IWT Akiyama</option>
				<option value="shinonome">IWT Shinonome</option>
				<option value="yoisaki">IWT Yoisaki</option>
			</optgroup>
	
			<optgroup label="Legacy Themes">
				<option value="x10-white">x10 White</option>
				<option value="legacy">IWT Legacy</option>
			</optgroup>
        
			<optgroup label="Pride Themes">
				<option value="gay-green">Gay Pride (Vincian Green)</option>
				<option value="lesbian">Lesbian Pride</option>
				<option value="bisexual">Bisexual Pride</option>
				<option value="transgender">Transgender Pride</option>
				<option value="nonbinary">Non-Binary Pride</option>
				<option value="pansexual">Pansexual Pride</option>
				<option value="genderfluid">Genderfluid Pride</option>
				<option value="aroace">Aroace Pride</option>
			</optgroup>

		</select>
		</div>
    </div>
    
    <div class="main-view">
        <div class="grid-container" id="gridContainer"></div>
        <div class="version-watermark">Happy Pride Month!</div>
    </div>

<script>
    const gameData = {
        'emuroot': { 
            title: "Emulation", 
            url: 'emulation.html',
            banner: 'banners/emulation.png'
        },
        'fnafroot': { 
            title: "FNAF Games", 
            url: 'fnaf/',
            banner: 'banners/fnaf1.png'
        },
        'gdtempplace': { 
            title: 'Geometry Dash', 
            url: 'gd/',
            banner: 'banners/gd.png'
        },
        'eaglerroot': { 
            title: 'Eaglercraft', 
            url: 'eaglercraftroot.html',
            banner: 'banners/eagler.jpg'
        },
        'baldiroot': { 
            title: "Baldi's Basics", 
            url: 'baldigames.html',
            banner: 'banners/baldiclassic.jpg'
        },
        'sus': { 
            title: "01001000 01000101 01001100 01010000 00100000 01001101 01000101 00100000 01010000 01001100 01000101 01000001 01010011 01000101", 
            url: 'coretrzp/placeholder.html',
            banner: 'coretrzp/herbanner.jpg'
        },
    };

    const gridContainer = document.getElementById('gridContainer');
    const sidebarList = document.getElementById('sidebarList');

    Object.keys(gameData).forEach(key => {
        const game = gameData[key];
        const card = document.createElement('div');
        card.className = 'game-card';
        card.onclick = () => window.location.href = game.url;
        card.innerHTML = `
            <img src="${game.banner || 'banners/placeholderbanner.png'}" alt="${game.title}">
            <div class="card-info">${game.title}</div>
        `;
        gridContainer.appendChild(card);

        const sidebarItem = document.createElement('div');
        sidebarItem.className = 'sidebar-item';
        sidebarItem.innerText = game.title;
        sidebarItem.onclick = () => window.location.href = game.url;
        sidebarList.appendChild(sidebarItem);
    });
</script>

<script src="theme.js"></script>
</body>
</html>
