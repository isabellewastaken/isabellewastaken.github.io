<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IWT - SNES Games</title>
	<script>
        (function() {
            const savedTheme = localStorage.getItem("selected-theme") || "asahina";
            document.documentElement.setAttribute("data-theme", savedTheme);
        })();
    </script>
	<link rel="stylesheet" href="../style.css">
</head>
<body>
    <div class="sidebar">
        <div class="sidebar-header">SNES Games</div>
        <div class="game-list" id="sidebarList">
            </div>
    </div>
    <div class="main-view">
        <div class="grid-container" id="gridContainer">
            </div>
		<div class="version-watermark">Happy Pride Month!</div>
    </div>
    <script>
const gameData = {
            'index': { 
                title: 'Back to Home', 
                url: '../emulation.html',
				banner: '../banners/placeholderbanner.jpg'
            },
            'smw': { 
                title: "Super Mario World", 
                url: 'smw.html',
                banner: '../banners/smw.jpg'
            },
            'lttp': { 
                title: "Link to the Past", 
                url: 'lttp.html',
                banner: '../banners/lttp.jpg'
            },
            'streetfighter2': { 
                title: "Street Fighter II", 
                url: 'sf2.html',
                banner: '../banners/sf2.png'
            },
//            'mariopaint': { 
//                title: "Mario Paint", 
//                url: 'mariopaint.html',
//                banner: '../banners/placeholderbanner.jpg'
//            },
        };
        const gridContainer = document.getElementById('gridContainer');
        const sidebarList = document.getElementById('sidebarList');
        Object.keys(gameData).forEach(key => {
            const game = gameData[key];
            const card = document.createElement('div');
            card.className = 'game-card';
            card.onclick = () => window.location.href = game.url;
			card.innerHTML = `
                <img src="${game.banner || 'banners/placeholderbanner.png'}" alt="${game.title}">
                <div class="card-info">${game.title}</div>
            `;
            gridContainer.appendChild(card);
            const sidebarItem = document.createElement('div');
            sidebarItem.className = 'sidebar-item';
            sidebarItem.innerText = game.title;
            sidebarItem.onclick = () => window.location.href = game.url;
            sidebarList.appendChild(sidebarItem);
        });	
    </script>
	<script src="../theme.js"></script>
</body>
</html>
