<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IWT's Video Player Test</title>
    <style>
        /* Reset margins and hide scrollbars to ensure full coverage */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000; /* Dark background to prevent flickering */
        }

        /* Container that locks to the viewport boundaries */
        .video-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: grid;
            place-items: center;
        }

        /* Forces the video to span the entire screen */
        video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            /* "contain" preserves aspect ratio with black bars if needed. */
            /* Change to "cover" if you want it cropped to fill the absolute entire screen. */
            object-fit: contain; 
        }
    </style>
</head>
<body>

    <div class="video-container">
        <video controls playsinline>
            <source src="videotest.mp4" type="video/mp4">
            Your browser does not support the video! Please use a modern browser.
        </video>
    </div>

</body>
</html>
