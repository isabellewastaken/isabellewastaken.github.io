<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IWT - Web Games</title>
	<script>
        (function() {
            const savedTheme = localStorage.getItem("selected-theme") || "asahina";
            document.documentElement.setAttribute("data-theme", savedTheme);
        })();
    </script>
    <link rel="stylesheet" href="../style.css">
</head>
<body>
    <div class="sidebar">
        <div class="sidebar-header">Categories</div>
        <div class="game-list" id="sidebarList"></div>
    </div>
    
    <div class="main-view">
        <div class="grid-container" id="gridContainer"></div>
    </div>

<script>
    const gameData = {
        'index': { 
            title: "Back to Home", 
            url: '../index.html',
            banner: '../banners/placeholderbanner.jpg'
        },
        'fnaf1': { 
            title: "FNAF 1", 
            url: 'https://irv77.github.io/hd_fnaf/1/',
            banner: '../banners/fnaf1.png'
        },
        'fnaf2': { 
            title: "FNAF 2", 
            url: 'https://irv77.github.io/hd_fnaf/2/',
            banner: '../banners/fnaf2.jpg'
        },
        'fnaf3': { 
            title: "FNAF 3", 
            url: 'https://irv77.github.io/hd_fnaf/3/',
            banner: '../banners/fnaf3.png'
        },
        'fnaf4': { 
            title: "FNAF 4", 
            url: 'https://irv77.github.io/hd_fnaf/4/',
            banner: '../banners/fnaf4.png'
        },
        'fnafworld': { 
            title: "FNAF World", 
            url: 'https://irv77.github.io/hd_fnaf/w/',
            banner: '../banners/fnafworld.png'
        },
        'fnafsister': { 
            title: "FNAF Sister Location", 
            url: 'https://irv77.github.io/hd_fnaf/sl/',
            banner: '../banners/sister.png'
        },
       'fnafpizzasim': { 
            title: "FNAF Pizzeria Simulator", 
            url: 'https://irv77.github.io/hd_fnaf/ps/',
            banner: '../banners/pizzeria.png'
        },
        'ucn': { 
            title: "Ultimate Custom Night", 
            url: 'https://irv77.github.io/hd_fnaf/ucn/',
            banner: '../banners/ucn.png'
        },
    };

    const gridContainer = document.getElementById('gridContainer');
    const sidebarList = document.getElementById('sidebarList');

    Object.keys(gameData).forEach(key => {
        const game = gameData[key];
        const card = document.createElement('div');
        card.className = 'game-card';
        card.onclick = () => window.location.href = game.url;
        card.innerHTML = `
            <img src="${game.banner || 'banners/placeholderbanner.png'}" alt="${game.title}">
            <div class="card-info">${game.title}</div>
        `;
        gridContainer.appendChild(card);

        const sidebarItem = document.createElement('div');
        sidebarItem.className = 'sidebar-item';
        sidebarItem.innerText = game.title;
        sidebarItem.onclick = () => window.location.href = game.url;
        sidebarList.appendChild(sidebarItem);
    });
</script>

<script src="../theme.js"></script>
</body>
</html>
